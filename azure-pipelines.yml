
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'acrtd269'
  aksResourceGroup: 'PipelineAKS-Demo269-RG'
  aksName: 'pipeline1-aks'
  imageName: 'demobook'

stages:

  # BUILD STAGE
  - stage: Build
    displayName: 'Test, build and publish the image'

    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push Docker Image'

        steps:
          - script: |
              set -e
              grep -q "Hello from Docker" app/index.html
              echo "Application test passed!"
            displayName: 'Test application HTML'

          - task: AzureCLI@2
            displayName: 'Build and push Docker image to ACR'
            inputs:
              azureSubscription: 'Azure-AKS-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                ACR_LOGIN_SERVER=$(az acr show \
                  --name $(acrName) \
                  --query loginServer \
                  --output tsv)

                echo "ACR Login Server: $ACR_LOGIN_SERVER"

                az acr login --name $(acrName)

                docker build \
                  -t $ACR_LOGIN_SERVER/$(imageName):$(Build.BuildNumber) \
                  app

                docker push \
                  $ACR_LOGIN_SERVER/$(imageName):$(Build.BuildNumber)

                echo "Docker image pushed successfully!"

                az acr repository show-tags \
                  --name $(acrName) \
                  --repository $(imageName) \
                  --output table

  # DEPLOY STAGE
  - stage: Deploy
    displayName: 'Deploy to AKS and verify'
    dependsOn: Build

    jobs:
      - job: DeployToAKS
        displayName: 'Deploy application to AKS'

        steps:
          - task: AzureCLI@2
            displayName: 'Deploy manifests and verify rollout'
            inputs:
              azureSubscription: 'Azure-AKS-Connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "Getting AKS credentials..."

                az aks get-credentials \
                  --resource-group $(aksResourceGroup) \
                  --name $(aksName) \
                  --overwrite-existing

                ACR_LOGIN_SERVER=$(az acr show \
                  --name $(acrName) \
                  --query loginServer \
                  --output tsv)

                echo "Updating Kubernetes image..."

                sed -i "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g; s|IMAGE_TAG|$(Build.BuildNumber)|g" k8s/deployment.yaml

                echo "Updated image:"
                grep "image:" k8s/deployment.yaml

                echo "Applying Kubernetes manifests..."

                kubectl apply -f k8s/

                echo "Waiting for deployment rollout..."

                kubectl rollout status deployment/demobook --timeout=180s

                echo "Checking pods and services..."

                kubectl get pods,services

                echo "Deployment completed successfully!"
